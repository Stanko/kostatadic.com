{% extends "base.html" %}

{% block content %}

<a class="back-link" href="/blog/">&laquo; Back to blog</a>

<div class="post__header">
  {% if page.date %}
    <time class="post__date" datetime="{{page.date}}">{{page.date}}</time>
  {% endif %}
  <h1>{{page.title}}</h1>
</div>

<!--{% if page.extra.image %}
  <div class="event__banner hover dots">
    <img src="./images/{{ page.extra.image | safe }}" alt="{{ page.title }}">
  </div>
{% endif %}-->

<section class="content">{{ page.content | safe }}</section>

<div class="post__tags">
  Tags: {% for tag in page.taxonomies.tags %}
    <a href="/tags/{{ tag | safe }}" class="tag">{{ tag }}</a>
  {% endfor %}
</div>

{% endblock content %}
