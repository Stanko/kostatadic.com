{% extends "base.html" %}
{% block content %}
<a class="back-link" href="/tags/">&laquo; Back to tags</a>

<h1>Posts tagged with: <strong>{{ term.name }}</strong></h1>

<div class="blog__posts">
  {% for page in term.pages %}
    {% set page = page %}
    {% include "partials/post-card.html" %}
  {% endfor %}
</div>

{% endblock %}
